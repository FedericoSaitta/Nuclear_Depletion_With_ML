# ============================================================================
#  Nuclear_Transport_With_ML — single dependency source of truth.
#
#  The repo has two disjoint halves (verified: no shared imports):
#     src/nuclear_surrogates/ → torch / lightning / torchdiffeq  [extra: ml]
#     data_generation/, util/ → openmc                          [extra: sim]
#
#  They are NEVER installed together (see [tool.uv].conflicts). OpenMC is not
#  on PyPI, so it is not listed as a dependency anywhere — it is injected into
#  the `sim` environment by scripts/install_openmc.sh (see the README).
# ============================================================================

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nuclear-transport-with-ml"
version = "0.1.0"
description = "DNN and Neural-ODE surrogates for OpenMC depletion calculations"
readme = "README.md"
authors = [
  { name = "Federico Saitta" },
  { name = "Abel Castaneda Rodriguez" },
]

# 3.12 is the only version that satisfies BOTH halves:
#   - OpenMC `develop` declares requires-python >= 3.12
#   - PyTorch ships CUDA wheels for cp312 on linux-x86_64 AND win-amd64
#     (cp314 is CPU-only today, so a 3.14 environment cannot use the GPU)
requires-python = ">=3.12,<3.13"

# Shared by both halves — verified by import, not by habit.
dependencies = [
  "numpy>=1.26,<3",
  "polars>=1.0",
  "h5py>=3.11",
  "matplotlib>=3.8",
  "loguru>=0.7",
]

[project.optional-dependencies]
# ---- ML half -------------------------------------------------------------
# Everything the ML package imports.
ml = [
  "torch>=2.6,<3",
  "lightning>=2.4,<3",
  "torchdiffeq>=0.2.4",
  "scikit-learn>=1.5",
  "omegaconf>=2.3",
  "tqdm>=4.66",
]

# ---- Simulation half -----------------------------------------------------
# NOTE: `openmc` is deliberately ABSENT — it does not exist on PyPI.
# What IS listed is exactly OpenMC's own Python dependency set, so that
# `uv pip install --no-deps <openmc-src>` in install_openmc.sh has nothing
# left to resolve and cannot drag an unlocked package into the environment.
sim = [
  "scipy>=1.13",
  "lxml>=5.0",
  "uncertainties>=3.2",
  "endf>=0.1",
  "ipython>=8.0",
  "setuptools>=68",
  # Not an OpenMC dependency: data_generation/** and util/** import it directly.
  # The ML half does not, so it stays out of the shared set.
  "pandas>=2.2",
  # Reads data_generation/configs/*.yaml. Pure Python, no build step. The ML
  # half reads its configs through omegaconf instead, which is ml-only.
  "pyyaml>=6",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov",
  "ruff==0.6.*",
  # tests/test_configs.py parses the YAML directly rather than through
  # OmegaConf, so the config checks do not depend on the loader under test.
  "pyyaml>=6",
]

[project.scripts]
nucml = "nuclear_surrogates.main:main"


# ---- packaging -----------------------------------------------------------
# src layout: everything under src/ is library code and nothing else is, so
# `find` needs no exclusion list. Configs, notebooks, datasets and results all
# live outside src/ and are therefore never packaged.
[tool.setuptools.packages.find]
where = ["src"]

# ============================================================================
#  uv configuration
# ============================================================================
[tool.uv]
# Lock for exactly the two machines this project runs on. Keeps uv.lock small
# and guarantees `uv sync` resolves identically on desktop and cluster.
environments = [
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

# `ml` and `sim` are mutually exclusive by design. Declaring the conflict
# makes uv lock them as separate resolutions AND makes
# `uv sync --extra ml --extra sim` a hard error instead of a silent mess.
conflicts = [
  [
    { extra = "ml" },
    { extra = "sim" },
  ],
]

# ---- PyTorch wheel index -------------------------------------------------
# torch on PyPI is the CPU build. Point `torch` at PyTorch's own index to get
# CUDA wheels. `explicit = true` means ONLY packages named in [tool.uv.sources]
# are fetched from here; everything else still comes from PyPI.
#
# CUDA 12.8 wheels require driver >= 528.33 (Windows) / >= 525.60 (Linux) via
# CUDA minor-version compatibility. This laptop reports driver 566.14 → fine.
# >>> VERIFY THE CLUSTER'S GPU-NODE DRIVER BEFORE FIRST SYNC. <<<
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

# ============================================================================
[tool.ruff]
target-version = "py312"
extend-exclude = ["notebooks"]   # learning-journey scripts, not library code

[tool.ruff.lint]
# Beyond the default (E4/E7/E9/F): import order, modern idioms, likely bugs, and
# the comprehension/return simplifications. ARG is deliberately absent — it
# flags Lightning's required hook signatures, which cannot be changed.
extend-select = ["I", "UP", "B", "SIM", "C4", "RET"]

[tool.ruff.lint.isort]
# data_generation/ is not a package: its modules import each other by bare name,
# which works because the entry point's own directory is on sys.path. Without
# this, isort reads them as third-party and interleaves them with numpy and
# openmc, which hides the fact that they are local.
known-first-party = [
  "common",
  "config",
  "dataset_io",
  "nuclides",
  "power_history",
  "quarter_sim",
  "reactor_sim",
  "tally_io",
]

[tool.ruff.lint.per-file-ignores]
# E402 (import not at top of file) is load-bearing in the datagen entry points:
# they must parse argv and set OMP_NUM_THREADS *before* `import openmc`, which
# reads the variable at import time. Restructuring them would change how the
# simulations are threaded, so the rule is scoped out instead.
"data_generation/datagen.py" = ["E402"]
"data_generation/quarter_datagen.py" = ["E402"]
"data_generation/zoom_datagen.py" = ["E402"]

# Same shape of problem on the ML side: the entry point must silence
# import-time warnings *before* `import lightning`, which is what triggers them.
"src/nuclear_surrogates/main.py" = ["E402"]

# util/clean_data.py puts data_generation/ on sys.path before importing from it,
# for the same reason the datagen entry points can import their siblings at all:
# neither directory is a package.
"util/clean_data.py" = ["E402"]

# ============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest resets the warning filters around every test, so the ones
# `nuclear_surrogates.utils.quiet` installs for normal runs do not survive here
# and have to be declared again. (The logging-level change it makes does
# survive, so the triton/flop-counter warning needs no entry.)
filterwarnings = [
  # lightning calls a torch pytree API that torch now deprecates — its fix, not ours.
  "ignore:.*treespec, LeafSpec.*",

  # The next two are lightning telling us to undo what the suite does on
  # purpose. Every test run is pinned to the CPU with num_workers=0 (see the
  # `isolated_run` fixture and the golden configs) because both the accelerator
  # and worker processes reorder float reductions, which is what the golden
  # fixtures pin. They are left unfiltered outside the suite, where the advice
  # is worth hearing. Neither fires on a CI runner — only on a machine that has
  # a GPU and spare cores, i.e. the laptop and the cluster.
  "ignore:GPU available but not used",
  "ignore:The .* does not have many workers",

  # joblib assigns to `ndarray.shape` while unpickling and NumPy 2.5 deprecates
  # that. joblib's fix; it only affects the convenience .joblib copy of the
  # preprocessor, never the JSON that models are actually served from.
  "ignore:Setting the shape on a NumPy array has been deprecated",
]
markers = [
  # The OpenMC install only — these build models and export XML, they run no
  # transport, so the 7 GB cross-section library is not needed for them.
  "openmc: requires the OpenMC install (skipped in the ML env)",
  "golden: pins published numbers against committed fixtures",
  # Pinned training numbers are only reproducible on a fixed runner image and
  # library set, so CI runs them in their own Linux-only job.
  "golden_train: pins a training loss trajectory; regenerate deliberately",
  "slow: takes more than a few seconds",
]
