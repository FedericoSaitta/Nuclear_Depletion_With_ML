# The CASL dataset: randomised-history pin-cell depletion.
#
# The randomised-history pipeline behind the CASL datasets, which is what both
# published models are trained on.
#
#   uv run --extra sim python data_generation/datagen.py \
#       --config data_generation/configs/casl_pincell.yaml -n 4 -c 16
#
# The YAML says what is simulated; -n/-c/-t/-s/--out say what machine runs it.
#
# The pin itself is shared with the BEAVRS configs, built by `pin_sim.py`: fuel,
# helium gap, Zircaloy-4 cladding, water. `symmetry` and the operating history
# are the only things this file changes about it, so a sweep from here is
# directly comparable to the BEAVRS runs.

model:
  enrichment: 3.1              # % U-235
  fuel_density: 10.4           # g/cm3 UO2
  # [fuel outer, gap outer, clad outer] in cm — same pin as the BEAVRS configs.
  geometry_radii: [0.39218, 0.40005, 0.45720]
  geometry_pitch: 1.25984      # cm
  # The whole cell, boundaries at +/-pitch/2. The BEAVRS configs model a quarter
  # of the same lattice; nothing else about the two pin models differs.
  symmetry: full

transport:
  particles: 5000
  batches: 60
  inactive: 10
  temp_method: interpolation   # or `nearest`
  use_wmp: false               # windowed multipole; overrides temp_method

depletion:
  # The CASL PWR chain: 228 nuclides. The BEAVRS config uses the much larger
  # chain_endfb71_pwr.xml, which is why a BEAVRS dataset carries 3819 nuclide
  # columns where a sweep from here carries 228. This set is a subset of that
  # one, so the two align on column name.
  chain_file: chain_casl_pwr.xml
  num_steps: 100
  delta_t_days: 10

  # Each step draws its operating state uniformly from these [low, high] ranges.
  # This is what makes the dataset a spread of histories rather than one run:
  # the surrogate has to learn the map, not memorise a trajectory. It is also
  # why this config has no fixed `fuel_temp`/`mod_temp`/`clad_temp`/`mod_density`
  # under `model`, where the BEAVRS configs do.
  power: [0, 41.4]             # W/g specific power
  t_fuel: [600, 1200]          # K
  t_mod: [550, 600]            # K
  t_clad: [570, 670]           # K
  rho_mod: [0.74, 1.00]        # g/cm3
  boron_ppm: [0, 1000]
