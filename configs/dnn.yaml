# The paper's 7-isotope DNN, as trained. Hyperparameters came from a per-target
# Optuna study, which is why the learning rate and weight decay are not round
# numbers.
#
#   nucml train --config configs/dnn.yaml --data datasets/casl_3305_runs_inter.h5
#
# This file describes the MODEL and nothing else — paths, device and mode are
# command-line flags.
dataset:
  fraction_of_data: 1.0

  # Fractions of whole runs. The DNN splits sequentially in time; the NODE
  # partitions by a seeded random permutation of runs.
  split:
    train: 0.8
    val: 0.1
    test: 0.1

  inputs:
    power_W_g: MinMax
    fuel_temp_K: MinMax
    mod_temp_K: MinMax
    clad_temp_K: MinMax
    mod_density_g_cm3: MinMax
    boron_ppm: MinMax
    U238: quantile
    U239: MinMax
    Np239: MinMax
    Pu239: robust
    Pu240: standard
    Pu241: MinMax
    Pu242: MinMax
  targets:
    U238: robust
    U239: robust
    Np239: standard
    Pu239: standard
    Pu240: robust
    Pu241: robust
    Pu242: robust

  # Predict c(t+1) - c(t) rather than c(t+1). U238 changes by only a few percent
  # over a full history, so a network asked for it directly scores R^2 ~ 1 by
  # copying its input.
  target_delta_conc: true

  train:
    batch_size: 512
  val:
    batch_size: 8192

model:
  kind: DNN
  name: BEST_7_Isotope_DNN
  layers: [128, 128]
  dropout_probability: 0.0
  activation: tanh
  output_activation: none
  residual_connections: true

train:
  loss: huber
  learning_rate: 0.0009134017134849459
  weight_decay: 0.00013378788391636378
  lr_scheduler_patience: 10
  num_epochs: 500
  early_stopping_patience: 20
  grad_clip: 0.0
  drop_last: false
